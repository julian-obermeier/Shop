name: PHP Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
