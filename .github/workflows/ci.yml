name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare test environment file
        run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, pdo_sqlite, gd
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: PHP syntax check
        run: find app routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: |
          node --check public/assets/js/app.js
          node --check public/service-worker.js

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fresh install and seed smoke test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/wear-and-earn-ci.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          touch /tmp/wear-and-earn-ci.sqlite
          php artisan migrate:fresh --seed --force
          php artisan route:list
          php artisan schedule:list
          php artisan view:cache
          php artisan view:clear

      - name: Run test suite
        run: php artisan test --display-warnings --display-deprecations
