name: Fresh Portal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo
      - run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: test -f database/schema.sql && grep -q 'CREATE TABLE IF NOT EXISTS offers' database/schema.sql && grep -q 'CREATE TABLE IF NOT EXISTS order_days' database/schema.sql
